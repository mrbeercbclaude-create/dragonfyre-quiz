<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragonfyre — ค้นหาเผ่าของคุณ</title>
<meta name="description" content="แบบทดสอบ 30 ข้อ หาบิลด์ เผ่า อาชีพ และพรจากเทพที่เหมาะกับคุณใน Cisco's Dragonfyre พร้อมคอนเซปต์และเส้นทางต่อยอดของบิลด์">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f6efe2; --card:#fffaf2; --ink:#2b2118; --ink2:#5c4d3f; --muted:#8a7a69; --line:#e6dccb;
  --agree:#4f8a3c; --disagree:#7b4f8f; --gold:#c8902e; --clay:#b5552f; --stone:#8c8378; --sky1:#f3b46b; --sky2:#f7d9a6;
  --c1:#4f8a3c; --c2:#c8902e; --c3:#b5552f; --c4:#4f7393; --c5:#7b4f8f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:400 16px/1.65 Kanit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--clay)}
.top{position:sticky;top:0;z-index:5;background:#fffaf2ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font:700 18px Cinzel,serif;letter-spacing:.06em;color:var(--ink);text-decoration:none}
.logo svg{width:28px;height:28px;image-rendering:pixelated}
.top .sp{flex:1}
.top .lnk{color:var(--ink2);font-size:14px;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%,var(--page));}
.hero .in{max-width:1080px;margin:0 auto;padding:56px 20px 0;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:end}
.hero h1{font:600 clamp(32px,5.4vw,54px)/1.12 Kanit,sans-serif;margin:0 0 10px;color:#3a2614}
.hero .kick{font:700 13px Cinzel,serif;letter-spacing:.2em;color:#7a4a1c;margin:0 0 8px}
.hero p{color:#5a3b1f;margin:0 0 22px;max-width:30em}
.hero .art{display:block;width:100%;height:auto;image-rendering:pixelated;margin-bottom:-1px}
.btn{appearance:none;border:0;border-radius:999px;background:var(--clay);color:#fff;font:500 17px Kanit,sans-serif;padding:13px 28px;cursor:pointer;box-shadow:0 4px 0 #8a3b1d;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a3b1d}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.ground{height:18px;background:repeating-linear-gradient(90deg,#6f9b3f 0 16px,#5f8a35 16px 32px);border-top:6px solid #79a845}
.dirt{height:26px;background:repeating-linear-gradient(90deg,#8a5a34 0 16px,#7a4f2d 16px 32px)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:-8px auto 0;padding:36px 20px 10px;max-width:1080px}
.info{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.info b{display:block;font-weight:600;margin-bottom:2px}
.info span{color:var(--ink2);font-size:15px}

/* quiz */
.bar{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:16px;padding:12px 18px;margin:28px 0 8px}
.bar .back{background:none;border:0;color:var(--c4);font:500 15px Kanit;cursor:pointer;padding:0}
.bar .back:disabled{opacity:.3;cursor:default}
.bar .track{flex:1;height:8px;background:#efe6d6;border-radius:8px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--c4);border-radius:8px;transition:width .3s}
.bar .step{color:var(--ink2);font-size:14px;white-space:nowrap}
.section-title{font:600 20px Kanit,sans-serif;color:var(--clay);margin:22px 0 0}
.section-sub{color:var(--ink2);margin:0;font-size:15px}
.q.two h3 .sit{color:var(--ink2)}
.q.two .likert .lab{width:150px;font-size:14px;line-height:1.35}
.ends2{display:none;justify-content:space-between;gap:12px;font-size:13px;line-height:1.35;margin:10px auto 0;max-width:420px}
.ends2 .l{color:var(--agree)}.ends2 .r{color:var(--disagree);text-align:right}
/* result extras */
.fx{display:grid;grid-template-columns:118px 1fr 56px;gap:4px 10px;align-items:center;font-size:13px;margin-top:8px}
.fx .nm{color:var(--ink2)}
.fx .bx{position:relative;height:10px;background:#f1e8d9;border-radius:6px}
.fx .bx i{position:absolute;top:0;bottom:0;border-radius:6px}
.fx .bx i.pos{left:50%;background:var(--agree)}.fx .bx i.neg{right:50%;background:var(--clay)}
.fx .bx::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#bfb3a1}
.fx .vl{text-align:right;font-variant-numeric:tabular-nums}
.fx .vl.p{color:var(--agree)}.fx .vl.n{color:var(--clay)}
.fx .tot{font-weight:600;color:var(--ink)}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
.dims h5{grid-column:1/-1;margin:12px 0 0;font:500 14px Kanit;color:var(--clay)}
.dim{display:grid;grid-template-columns:118px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.dim .bx{height:8px;background:#f1e8d9;border-radius:6px;overflow:hidden}
.dim .bx i{display:block;height:100%;background:var(--c4);border-radius:6px}
.dim .vl{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.rank{display:grid;grid-template-columns:24px minmax(0,1fr) 90px 40px;gap:8px;align-items:center;font-size:14px;padding:5px 0;border-top:1px dashed var(--line)}
.rank .no{color:var(--muted);text-align:right}
.rank .bx{height:8px;background:#f1e8d9;border-radius:6px;overflow:hidden}
.rank .bx i{display:block;height:100%;background:var(--gold)}
.rank .vl{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.rank small{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;font:500 14px Kanit;color:var(--ink2);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.infl{display:grid;gap:6px;font-size:14px}
.infl div{display:grid;grid-template-columns:44px 1fr;gap:8px}
.infl .vl{font-variant-numeric:tabular-nums;text-align:right}
.how{font-size:14px;color:var(--ink2)}
.how li{margin:4px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat div{background:#fff7;border:1px solid #e3c79a;border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:20px;color:#3a2614;line-height:1.2}
.stat span{font-size:12px;color:#6b4320}
.stars{color:var(--gold);letter-spacing:1px}
.qs{max-width:900px;margin:0 auto}
.q{padding:34px 0 32px;border-bottom:1px solid var(--line);transition:opacity .25s}
.q.done{opacity:.45}
.q.done:hover{opacity:1}
.q h3{font-weight:500;font-size:clamp(18px,2.4vw,22px);margin:0 0 20px;text-align:center}
.likert{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,22px)}
.likert .lab{font-size:15px;width:90px}
.likert .lab.l{color:var(--agree);text-align:right}
.likert .lab.r{color:var(--disagree)}
.dot{appearance:none;border-radius:50%;background:transparent;cursor:pointer;flex:none;border:2.5px solid;transition:background .15s,transform .1s;position:relative}
.dot:hover{transform:scale(1.06)}
.dot.s3{width:60px;height:60px}.dot.s2{width:48px;height:48px}.dot.s1{width:38px;height:38px}.dot.s0{width:30px;height:30px;border-color:#b9ad9c}
.dot.a{border-color:var(--agree)}.dot.d{border-color:var(--disagree)}
.dot.a.on{background:var(--agree)}.dot.d.on{background:var(--disagree)}.dot.s0.on{background:#b9ad9c}
.dot.on::after{content:"";position:absolute;left:50%;top:50%;width:30%;height:16%;border:3px solid #fff;border-top:0;border-right:0;transform:translate(-50%,-70%) rotate(-45deg)}
.mid-note{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
.next{display:flex;justify-content:center;padding:34px 0 60px}

/* result */
.rhero{background:linear-gradient(180deg,var(--sky1),var(--sky2) 75%,var(--page))}
.rhero .in{max-width:1080px;margin:0 auto;padding:46px 20px 26px;display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:center}
.rhero .kick{font-size:15px;color:#6b4320;margin:0}
.rhero h1{font:600 clamp(30px,5vw,50px)/1.1 Kanit,sans-serif;margin:4px 0 4px;color:#3a2614}
.rhero .trio{font-size:clamp(17px,2.3vw,21px);color:var(--clay);font-weight:500}
.rhero .emb{justify-self:center;width:min(190px,50vw);height:auto;image-rendering:pixelated;filter:drop-shadow(0 8px 0 #0000001a)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start;padding:30px 0 70px}
.grid2>*,.grid2 .panel,.combo>div{min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.h2{display:flex;align-items:center;gap:12px;font:600 26px Kanit;margin:0 0 14px}
.h2 .n{width:36px;height:36px;border-radius:50%;border:2px solid var(--agree);color:var(--agree);display:grid;place-items:center;font-size:17px}
.trait{margin:4px 0 20px}
.trait .pct{text-align:center;font-weight:500;font-size:15px;margin-bottom:4px}
.trait .rail{position:relative;height:10px;border-radius:10px}
.trait .knob{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid;transform:translate(-50%,-50%)}
.trait .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:13px;color:var(--ink2)}
.chip.no{border-color:#e7c3b4;color:var(--clay);background:#fdf3ee}
.combo{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:18px 0;border-top:1px solid var(--line)}
.combo:first-child{border-top:0}
.combo .rk{width:44px;height:44px;border-radius:10px;background:#f3e8d6;display:grid;place-items:center;font:700 20px Cinzel,serif;color:#7a4a1c}
.combo.top .rk{background:var(--clay);color:#fff}
.combo h4{margin:0;font-size:19px;font-weight:600}
.combo h4 small{font-weight:400;color:var(--ink2);font-size:16px}
.tags{font-size:13px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 14px}
.tags .ok{color:var(--agree)}.tags .cv{color:var(--c4)}.tags .bad{color:var(--clay)}
.combo details{margin-top:6px}
.combo summary{cursor:pointer;color:var(--muted);font-size:14px}
.combo .desc{font-size:14px;color:var(--ink2);display:grid;gap:4px;margin-top:6px}
.combo .desc b{color:var(--ink);font-weight:500}
.side{position:sticky;top:76px;display:grid;gap:12px}
.side .btn{width:100%}
.foot{color:var(--muted);font-size:13px;padding:0 0 40px;text-align:center}
@media (max-width:820px){
  .hero .in,.rhero .in{grid-template-columns:1fr}
  .hero .art{max-width:520px;margin:0 auto}
  .cards{grid-template-columns:1fr}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .likert .lab{display:none}
  .ends2{display:flex}
  .dims{grid-template-columns:1fr}
  .fx{grid-template-columns:96px 1fr 48px}
  .stat b{font-size:17px}
  .rhero .emb{width:150px}
}
@media (max-width:420px){.dot.s3{width:46px;height:46px}.dot.s2{width:38px;height:38px}.dot.s1{width:31px;height:31px}.dot.s0{width:25px;height:25px}}
/* v6: build concept */
.mod{display:inline-block;font-size:11px;line-height:1.5;padding:0 7px;border-radius:999px;background:#efe6d6;color:var(--ink2);vertical-align:middle}
.arch{font-size:14px;color:var(--c4);font-weight:500;margin-top:2px}
.archbig{display:inline-block;margin-top:8px;background:#fff8;border:1px solid #e3c79a;border-radius:999px;padding:3px 14px;font-weight:500;color:#6b4320}
.concept h5{margin:16px 0 4px;font:600 16px Kanit;color:var(--clay)}
.concept h5:first-child{margin-top:4px}
.concept p{margin:0;font-size:15px;color:var(--ink2)}
.concept p b{color:var(--ink);font-weight:500}
.bst{display:grid;grid-template-columns:84px 1fr 28px;gap:5px 10px;align-items:center;font-size:13px}
.bst .bx{height:9px;background:#f1e8d9;border-radius:6px;overflow:hidden}
.bst .bx i{display:block;height:100%;background:var(--gold);border-radius:6px}
.bst .vl{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.tipl{margin:4px 0 0;padding-left:20px;font-size:14px;color:var(--ink2)}
.tipl li{margin:5px 0}
.tipl b{color:var(--ink);font-weight:500}
.tipt{color:var(--muted)}
.cv{color:var(--c4)}.bad{color:var(--clay)}
.forks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.forks div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;display:grid;font-size:14px}
.forks b{font-weight:500}.forks span{color:var(--ink2)}.forks small{color:var(--muted)}
.rkbox{max-height:520px;overflow:auto;padding-right:6px}
@media (max-width:820px){.forks{grid-template-columns:1fr}}
</style>
<body>
<header class="top"><div class="in">
  <a class="logo" href="#" id="home"><svg viewBox="0 0 8 8" id="logoSvg"></svg>DRAGONFYRE</a>
  <span class="sp"></span>
  <a class="lnk" href="guide.html">คู่มือเผ่า อาชีพ และพร</a>
</div></header>
<main id="app"></main>
<script src="addons.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
