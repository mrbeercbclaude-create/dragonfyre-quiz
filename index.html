<title>Dragonfyre — หาเผ่าที่ใช่</title>
<meta name="description" content="แบบทดสอบ 12 ข้อ หาเผ่า อาชีพ และพรจากเทพที่เหมาะกับคุณใน Cisco's Dragonfyre">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120d0a; --panel:#1d1511; --panel2:#271c16; --line:#3d2c22;
  --ink:#f1e6d6; --muted:#b8a48c; --gold:#e8b45a; --ember:#e0602d; --ok:#7fbf6a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#3a1d10 0%,var(--bg) 60%) fixed;color:var(--ink);font:400 16px/1.6 Kanit,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
h1{font:800 clamp(28px,7vw,44px)/1.1 Cinzel,serif;letter-spacing:.04em;margin:0 0 6px;color:var(--gold);text-shadow:0 2px 18px #e0602d55}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 10px 30px #0006}
.btn{appearance:none;border:1px solid var(--gold);background:linear-gradient(180deg,#e8b45a,#b9812f);color:#1b120c;font:600 17px Kanit,sans-serif;padding:12px 22px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.progress{height:6px;background:#2a1f18;border-radius:6px;overflow:hidden;margin:0 0 18px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold));width:0;transition:width .25s}
.qnum{color:var(--muted);font-size:14px;margin-bottom:4px}
.q{font-size:21px;font-weight:600;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:#160f0c;color:var(--ink);font:400 16px Kanit,sans-serif;padding:13px 14px;border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:#2e1f12}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.res-head{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted)}
.combo{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#170f0c;margin-bottom:12px}
.combo.top{border-color:var(--gold);box-shadow:0 0 0 1px #e8b45a44 inset}
.rank{font:800 26px Cinzel,serif;color:var(--gold);text-align:center;line-height:1.2}
.trio{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:600;font-size:18px}
.trio span small{display:block;font-weight:300;font-size:12px;color:var(--muted);letter-spacing:.05em}
.why{color:var(--muted);font-size:14px;margin-top:6px}
.desc{font-size:14px;margin-top:8px;display:grid;gap:3px}
.desc b{color:var(--gold);font-weight:600}
.warn{color:#f0a070;font-size:13px;margin-top:6px}
.match{font-size:13px;color:var(--ok)}
.foot{color:var(--muted);font-size:13px;margin-top:22px}
a{color:var(--gold)}
@media (max-width:520px){.q{font-size:19px}.trio{font-size:16px}.combo{grid-template-columns:32px 1fr;padding:13px}}
</style>
</head>

</div>

 {q:"อยากให้ตัวละครดูเป็นแบบไหน?",o:[

 {q:"เป้าหมายใหญ่ของคุณในเซิร์ฟนี้?",o:[

// ความชอบเฉพาะทางที่ควรชี้ขาด (ตอบมาแล้วต้องเห็นผล)
const SIG={water:1.6,nether:1.6,pets:1.4};
// คะแนนสูงสุดที่แต่ละมิติเป็นไปได้
const DMAX={}; QS.forEach(Q=>{const m={}; Q.o.forEach(o=>{for(const k in o[1]) m[k]=Math.max(m[k]||0,o[1][k])}); for(const k in m) DMAX[k]=(DMAX[k]||0)+m[k]});
const app=document.getElementById("app");
let step=-1, ans=[];

function render(){
  if(step<0){
    app.innerHTML=`<p style="margin-top:0">ใช้เวลาประมาณ 2 นาที ไม่มีคำตอบผิด ตอบตามที่ชอบจริงๆ</p>
      <p class="match">ผลลัพธ์จะเรียงจากเข้ากับคุณมากที่สุด พร้อมเหตุผลและข้อเสียที่ต้องรู้</p>
      <button class="btn" id="go">เริ่มเลย</button>`;
    document.getElementById("go").onclick=()=>{step=0;render()};
    return;
  }
  if(step>=QS.length){showResult();return}
  const Q=QS[step];
  app.innerHTML=`<div class="progress"><i style="width:${step/QS.length*100}%"></i></div>
    <div class="qnum">ข้อ ${step+1} / ${QS.length}</div>
    <p class="q">${Q.q}</p>
    <div class="opts">${Q.o.map((o,k)=>`<button class="opt${ans[step]===k?" sel":""}" data-k="${k}">${o[0]}</button>`).join("")}</div>
    <div class="nav"><button class="btn ghost" id="back" ${step===0?"disabled":""}>ย้อนกลับ</button></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[step]=+b.dataset.k;step++;render()});
  document.getElementById("back").onclick=()=>{if(step>0){step--;render()}};
}

function profile(){
  const u={}; let risk=1;
  QS.forEach((Q,i)=>{const o=Q.o[ans[i]]; for(const k in o[1]) u[k]=(u[k]||0)+o[1][k]; if(o.length>2){ if(i===3) risk=o[2]; else risk+=o[2]; }});
  // ปรับสเกล: มิติที่ถามน้อยข้อ (เช่น น้ำ, ไฟ, ลูกสมุน) ต้องมีน้ำหนักเท่ามิติที่ถามบ่อย
  for(const k in u) u[k]=u[k]/DMAX[k]*10*(SIG[k]||1);
  return {u, risk:Math.max(0,Math.min(3,risk))};
}
const dot=(u,w)=>Object.keys(w).reduce((s,k)=>s+(u[k]||0)*w[k],0);

function showResult(){
  const {u,risk}=profile();
  const total=Object.values(u).reduce((a,b)=>a+b,0)||1;
  const oS=ORIGINS.map(o=>{
    let s=dot(u,o.w);
    if(o.i>risk+1) s-= (o.i-risk-1)*total*0.35;     // เผ่าข้อเสียหนักเกินที่รับได้
    if(o.i===3 && risk<=1) s-= total*0.25;
    if(o.broken) s-= total*0.08;
    return {...o,s};
  });
  const cS=CLASSES.map(c=>({...c,s:dot(u,c.w)}));
  const bS=BLESSINGS.map(b=>({...b,s:dot(u,b.w)}));
  // ทุกเผ่าจับคู่อาชีพ+พรที่เข้ากับเผ่านั้นที่สุด แล้วเรียงเผ่าตามคะแนนคู่ที่ดีที่สุด
  const perO=oS.map(o=>{
    const list=[];
    for(const c of cS) for(const b of bS){
      // โบนัสเมื่อสามอย่างเสริมมิติเดียวกัน
      let syn=0; for(const k in o.w){ if((u[k]||0)<3) continue; if(c.w[k]) syn+=1; if(b.w[k]) syn+=1; } for(const k in c.w) if((u[k]||0)>=3&&b.w[k]) syn+=.5;
      list.push({o,c,b,s:o.s+c.s*0.7+b.s*0.6+syn*total*0.12});
    }
    list.sort((a,b)=>b.s-a.s);
    return list;
  }).sort((a,b)=>b[0].s-a[0].s);
  const pick=[],cntC={},cntB={};
  for(const list of perO){
    if(pick.length===10) break;
    // อาชีพหรือพรเดียวกันโผล่ได้ไม่เกิน 3 ชุด ใช้คู่ที่ดีรองลงมาแทน
    const x=list.find(y=>(cntC[y.c.n]||0)<3&&(cntB[y.b.n]||0)<3)||list[0];
    pick.push(x); cntC[x.c.n]=(cntC[x.c.n]||0)+1; cntB[x.b.n]=(cntB[x.b.n]||0)+1;
  }
  pick.sort((a,b)=>b.s-a.s);
  const best=pick[0].s;
  const topDims=Object.entries(u).filter(([k])=>k!=="simple"||u.simple>4).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k])=>DIMS[k]);
  const riskTxt=["ไม่ชอบข้อเสีย","รับข้อเสียได้นิดหน่อย","รับข้อเสียได้ถ้าคุ้ม","ชอบความท้าทาย"][risk];
  app.innerHTML=`<p class="q" style="margin-bottom:6px">สไตล์ของคุณ</p>
    <div class="res-head">${topDims.map(t=>`<span class="chip">${t}</span>`).join("")}<span class="chip">${riskTxt}</span></div>
    ${pick.map((x,i)=>{
      const why=Object.keys(DIMS).filter(k=>(u[k]||0)>0&&((x.o.w[k]||0)+(x.c.w[k]||0)+(x.b.w[k]||0))>=2)
        .sort((a,b)=>(u[b]*((x.o.w[b]||0)+(x.c.w[b]||0)+(x.b.w[b]||0)))-(u[a]*((x.o.w[a]||0)+(x.c.w[a]||0)+(x.b.w[a]||0)))).slice(0,3).map(k=>DIMS[k]);
      const pct=Math.max(55,Math.round(x.s/best*100));
      return `<div class="combo${i===0?" top":""}">
        <div class="rank">${i+1}</div>
        <div>
          <div class="trio"><span><small>ORIGIN</small>${x.o.n}</span><span><small>CLASS</small>${x.c.n}</span><span><small>BLESSING</small>${x.b.n}</span></div>
          <div class="match">เข้ากับคุณ ${pct}%${why.length?" · เด่นเรื่อง "+why.join(", "):""}</div>
          <div class="desc"><div><b>${x.o.n}:</b> ${x.o.d}</div><div><b>${x.c.n}:</b> ${x.c.d}</div><div><b>${x.b.n}:</b> ${x.b.d}</div></div>
          ${x.o.broken?`<div class="warn">ในเซิร์ฟเรา: ${x.o.broken}</div>`:""}
        </div></div>`}).join("")}
    <div class="nav"><button class="btn ghost" id="redo">ทำใหม่</button><button class="btn" id="copy">คัดลอกผลไปส่งเพื่อน</button></div>`;
  document.getElementById("redo").onclick=()=>{step=-1;ans=[];render();window.scrollTo(0,0)};
  document.getElementById("copy").onclick=async e=>{
    const t="ผลแบบทดสอบ Dragonfyre ของฉัน:\n"+pick.map((x,i)=>`${i+1}. ${x.o.n} + ${x.c.n} + ${x.b.n}`).join("\n")+"\n"+location.href;
    try{await navigator.clipboard.writeText(t);e.target.textContent="คัดลอกแล้ว"}catch{e.target.textContent="คัดลอกไม่ได้"}
  };
  window.scrollTo(0,0);
}
render();
</script>
